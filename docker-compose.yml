version: '3.8'

services:
  # Backend Server Configuration
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: node_server
    ports:
      - "3000:3000" # Exposes server to your local machine
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/collabcanvas
      - CLIENT_URL=http://localhost:4173
    restart: always
    depends_on:
      - mongo
  # Frontend Client Configuration
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:3000
    container_name: react_client
    ports:
      - "4173:4173" # Exposes client to your browser
    environment:
      - VITE_BACKEND_URL=http://localhost:3000
    restart: always
    depends_on:
      - server # Ensures the server starts before the client

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db # Persists data locally
    restart: always

volumes:
  mongo-data:
